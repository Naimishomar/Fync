<!doctype html>
<meta charset="utf-8"><title>Fync — Signup</title>
<link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/ui.css">
<body class="screen">
<div class="statusbar"><span>9:41</span><span class="sb-right"><span class="sb-bar" style="height:7px"></span><span class="sb-bar" style="height:9px"></span><span class="sb-bar" style="height:11px"></span><span class="sb-batt"><i></i></span></span></div>

<div class="scroll pad">
  <div class="mt6">
    <div class="display" style="font-size:40px">Fync</div>
    <div class="body mt3">Join the exclusive student network</div>
  </div>

  <div class="card stamp pad-in mt5">
    <div class="label">Email</div>
    <div class="search mt2" style="border-width:1.5px"><span style="color:var(--ink)">naimish@kiet.edu</span></div>
    <div class="label mt4">Username</div>
    <div class="search mt2" style="border-width:1.5px"><span style="color:var(--ink)">naimish</span></div>
    <div class="label mt4">Phone Number</div>
    <div class="search mt2" style="border-width:1.5px"><span style="color:var(--ink)">+91 98765 43210</span></div>
    <div class="label mt4">Password</div>
    <div class="search mt2" style="border-width:1.5px">
      <span style="color:var(--ink);letter-spacing:3px">••••••••</span>
      <span style="flex:1"></span><i class="ic ic-eye" style="color:var(--ink-3)"></i>
    </div>

    <div class="row flush gap3 mt4">
      <span style="width:22px;height:22px;border:2px solid var(--ink);border-radius:5px;display:flex;align-items:center;justify-content:center;flex:none">
        <i class="ic s ic-check" style="width:14px;height:14px"></i></span>
      <span class="sm">I agree to the <b style="color:var(--ink)">Terms &amp; Conditions</b></span>
    </div>

    <a class="btn primary block mt4">Send OTP</a>
  </div>

  <div class="rule"><span class="label">Step 2</span><span class="line"></span><span class="count">after OTP is sent</span></div>
  <div class="card pad-in" style="opacity:.55">
    <div class="label">Enter OTP (Check your email)</div>
    <div class="row flush gap2 mt3">
      <span style="flex:1;height:56px;border:1.5px dashed var(--ink-4);border-radius:var(--r);display:flex;align-items:center;justify-content:center" class="num">–</span>
      <span style="flex:1;height:56px;border:1.5px dashed var(--ink-4);border-radius:var(--r);display:flex;align-items:center;justify-content:center" class="num">–</span>
      <span style="flex:1;height:56px;border:1.5px dashed var(--ink-4);border-radius:var(--r);display:flex;align-items:center;justify-content:center" class="num">–</span>
      <span style="flex:1;height:56px;border:1.5px dashed var(--ink-4);border-radius:var(--r);display:flex;align-items:center;justify-content:center" class="num">–</span>
    </div>
    <a class="btn quiet sm block mt3">Verify &amp; Continue</a>
  </div>

  <div class="row flush gap2 mt5" style="justify-content:center">
    <span class="sm">Already have an account?</span><a class="sm" style="color:var(--ink);font-weight:700">Login</a>
  </div>
  <div class="clear sm"></div>
</div>
