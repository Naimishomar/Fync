<!doctype html>
<meta charset="utf-8"><title>Fync — 1v1 Battle</title>
<link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/ui.css">
<body class="screen">
<div class="statusbar"><span>9:41</span><span class="sb-right"><span class="sb-bar" style="height:7px"></span><span class="sb-bar" style="height:9px"></span><span class="sb-bar" style="height:11px"></span><span class="sb-batt"><i></i></span></span></div>

<div class="appbar">
  <a class="iconbtn back"><i class="ic ic-left"></i></a>
  <div class="grow"><div class="h2">Arena</div><div class="meta trunc">Select your combat domain</div></div>
  <div class="actions"><a class="iconbtn boxed"><i class="ic ic-podium"></i></a></div>
</div>
<div class="scroll pad">
  <div class="card stamp pad-in mt2">
    <div class="row flush" style="justify-content:space-between;align-items:center">
      <div style="text-align:center;flex:1">
        <div class="av l ring-student" style="margin:0 auto">NO</div>
        <b style="font-size:14px;display:block;margin-top:8px">You</b>
      </div>
      <div class="display" style="font-size:24px;color:var(--brand-600);padding:0 6px">VS</div>
      <div style="text-align:center;flex:1">
        <div class="av l" style="margin:0 auto;background:var(--paper-2);color:var(--ink-3)"><i class="ic l ic-search"></i></div>
        <b style="font-size:14px;display:block;margin-top:8px">Searching…</b>
      </div>
    </div>
    <div class="row flush gap2 mt5">
      <a class="btn primary sm" style="flex:1"><i class="ic s ic-swords"></i>Locate Rival</a>
      <a class="btn quiet sm">Abort Protocol</a>
    </div>
  </div>

  <div class="rule"><span class="label">Combat domain</span><span class="line"></span><span class="count">6</span></div>
  <div class="grid">
    <a class="tile"><span class="box" style="border-color:var(--events)33"><i class="ic ic-code" style="color:var(--events)"></i></span><em>DSA</em></a>
    <a class="tile"><span class="box"><i class="ic ic-image" style="color:var(--events)"></i></span><em>Frontend</em></a>
    <a class="tile"><span class="box"><i class="ic ic-wrench" style="color:var(--events)"></i></span><em>Backend</em></a>
    <a class="tile"><span class="box"><i class="ic ic-grid" style="color:var(--events)"></i></span><em>System Design</em></a>
    <a class="tile"><span class="box"><i class="ic ic-refresh" style="color:var(--events)"></i></span><em>DevOps</em></a>
    <a class="tile"><span class="box"><i class="ic ic-shield" style="color:var(--events)"></i></span><em>Cyber Security</em></a>
  </div>

  <div class="rule"><span class="label">Global Aces</span><span class="line"></span><span class="count">top 3</span></div>
  <div class="card pad-in">
    <div class="row flush gap3"><span class="num" style="width:26px;color:var(--alumni)">1</span><div class="av s ring-student">SM</div>
      <div class="grow"><b style="font-size:14px">Simran M.</b><div class="meta">DSA · 48 wins</div></div></div>
    <div class="divider mt3"></div>
    <div class="row flush gap3 mt3"><span class="num" style="width:26px;color:var(--ink-3)">2</span><div class="av s ring-student">AR</div>
      <div class="grow"><b style="font-size:14px">Arjun R.</b><div class="meta">Backend · 41 wins</div></div></div>
  </div>

  <div class="clear"></div>
</div>


<nav class="tabbar"><a class="t"><i class="ic ic-home"></i><em>Home</em></a><a class="t"><i class="ic ic-play"></i><em>Shorts</em></a><div class="fab"><i class="ic l ic-plus"></i></div><a class="t on"><i class="ic ic-compass"></i><em>Explore</em></a><a class="t"><i class="ic ic-user"></i><em>You</em></a></nav>
