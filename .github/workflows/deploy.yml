name: Deploy Backend to EC2

on:
  push:
    branches:
      - main  # This assumes your default branch is 'main'. Change to 'master' if yours is master.
    paths:
      - 'backend/**' # This ensures it only restarts the server if you changed backend code.

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          # 1. Navigate to your backend directory on EC2 (Change "Fync" if your folder is named differently on EC2)
          cd ~/Fync/backend
          
          # 2. Hard reset to remove any conflicting local changes on the server
          git reset --hard HEAD
          
          # 3. Pull the absolute newest code from GitHub
          git pull origin main
          
          # 4. Install any new npm packages
          npm install
          
          # 5. Restart the PM2 process (Change "fync-backend" to whatever name you gave it in PM2)
          pm2 restart fync-backend
