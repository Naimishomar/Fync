name: Deploy Backend to EC2

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# A second push while the first is still deploying used to interleave two
# `git reset --hard` + restart cycles on the same box.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  # ── Gate ───────────────────────────────────────────────────────────────────
  # Nothing reaches the server until these pass. The previous workflow deployed
  # straight from a push with no verification at all.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Placeholders only — no real credential belongs in this file, and the suites
    # never reach a third party. They exist because several SDKs (Razorpay, Groq)
    # throw at construction time and utils/r2.js calls process.exit(1) at import
    # when its variables are absent, which would take the whole run down before a
    # single test ran.
    env:
      REDIS_URL: redis://127.0.0.1:6379
      MONGO_URI: mongodb://127.0.0.1:27017/unused
      JWT_SECRET: ci-test-secret-that-is-long-enough-to-pass-checks
      JWT_REFRESH_SECRET: ci-test-refresh-secret-distinct-and-long-enough
      RAZORPAY_KEY_ID: rzp_test_ci0000000000
      RAZORPAY_KEY_SECRET: ci_dummy_secret
      R2_ACCOUNT_ID: test
      R2_ACCESS_KEY_ID: test
      R2_SECRET_ACCESS_KEY: test
      R2_BUCKET_NAME: test
      R2_PUBLIC_URL: https://example.invalid
      GROQ_API_KEY: ci-dummy
      GEMINI_API_KEY: ci-dummy
      TMDB_ACCESS_TOKEN: ci-dummy
      RAPIDAPI_KEY: ci-dummy
      RAPIDAPI_HOST: example.invalid
      JUDGE0_URL: https://example.invalid
      LEETCODE_API: https://example.invalid
      TWILIO_ACCOUNT_SID: ACci0000000000000000000000000000
      TWILIO_AUTH_TOKEN: ci-dummy
      TWILIO_SERVICE_SID: VAci0000000000000000000000000000
      GITHUB_CLIENT_ID: ci-dummy
      GITHUB_CLIENT_SECRET: ci-dummy
      GITHUB_REDIRECT_URI: https://example.invalid/cb
      ADMIN_PANEL_PASSWORD: ci-dummy
      ETHEREAL_USERNAME: ci@example.invalid
      ETHEREAL_PASSWORD: ci-dummy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install (locked)
        run: npm ci

      - name: Unit suites
        run: npm test

      - name: Every controller responds
        run: npm run smoke

      - name: Business-logic invariants
        run: npm run test:logic

      - name: Production install resolves
        # Catches package.json / package-lock.json drift before it reaches the
        # server, where `npm ci --omit=dev` would fail mid-deploy.
        run: |
          rm -rf /tmp/prodcheck && mkdir -p /tmp/prodcheck
          cp package.json package-lock.json /tmp/prodcheck/
          cd /tmp/prodcheck && npm ci --omit=dev --ignore-scripts

  # ── Deploy ─────────────────────────────────────────────────────────────────
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          # The old script hardcoded origin/main while the workflow also
          # triggered on master — pushing to master deployed main's code.
          TARGET_REF: ${{ github.ref_name }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: TARGET_REF
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd ~/Fync/backend

            PREVIOUS=$(git rev-parse HEAD)
            echo "current: $PREVIOUS"

            # Any failure after this point (npm ci, pm2, health) restores the
            # previous commit. Without the trap, `set -e` would abort on a pm2
            # error and leave the checkout ahead of the process actually running.
            rollback() {
              # No `set -e` in here: a failing step must not abort the rollback
              # before the restart and the logs that explain the failure.
              set +e
              echo "deploy failed — rolling back to $PREVIOUS"
              git reset --hard "$PREVIOUS"
              npm ci --omit=dev
              # By process name, not by config file: the old commit may predate
              # ecosystem.config.cjs, and `pm2 ... ecosystem.config.cjs` then dies
              # with "File not found" without ever restarting anything.
              #
              # The name must match `name` in ecosystem.config.cjs. It said
              # fync-backend while the process has always been fync-api, so the
              # rollback restarted nothing and printed no logs — the recovery
              # path was broken in exactly the situation it exists for.
              #
              # restart, not reload: reload waits for the new process to send
              # 'ready' (wait_ready is on, listen_timeout 20s). During a rollback
              # the app is already known to be unhealthy, and a reload that times
              # out leaves the broken process serving.
              pm2 restart fync-api --update-env || pm2 start ecosystem.config.cjs --env production
              pm2 save
              pm2 logs fync-api --lines 40 --nostream
              exit 1
            }
            trap rollback ERR

            git fetch origin --prune
            git reset --hard "origin/${TARGET_REF}"
            echo "deploying: $(git rev-parse --short HEAD) — $(git log -1 --pretty=%s)"

            # ci, not install: install ignores the lock file and can pull
            # versions that were never tested. --omit=dev keeps the test-only
            # MongoDB binary off the server.
            npm ci --omit=dev

            # startOrReload handles the case where the process is not running
            # (first deploy, or after it crashed out of the process list), which
            # plain `pm2 restart` cannot. reload is a rolling restart, so open
            # requests and websockets drain instead of being cut — this is what
            # the wait_ready / process.send('ready') handshake exists for.
            # --update-env is required for NODE_ENV=production to actually apply.
            pm2 startOrReload ecosystem.config.cjs --env production --update-env
            pm2 save

            echo "waiting for health..."
            PORT=$(grep -E '^PORT=' .env | cut -d= -f2 | tr -d '"' | tr -d "'" || true)
            PORT=${PORT:-8000}

            HEALTHY=0
            for i in $(seq 1 20); do
              if curl -fsS --max-time 3 "http://127.0.0.1:${PORT}/health" > /dev/null; then
                HEALTHY=1
                break
              fi
              sleep 3
            done

            if [ "$HEALTHY" != "1" ]; then
              echo "health check failed"
              rollback
            fi

            trap - ERR
            echo "healthy on port ${PORT}"
            pm2 status
