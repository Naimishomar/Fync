<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Share cards (sharp SVG text). The server has no system fonts, so every
     family resolves to the Inter files in this folder. -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <cachedir>/tmp/fync-fontconfig</cachedir>
  <alias><family>sans-serif</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>system-ui</family><prefer><family>Inter</family></prefer></alias>
</fontconfig>
